<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<script>
			try {
				const t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		<meta name="description" content="iaco — a blog on wellness and digital lifestyle." />
		<link rel="alternate" type="application/rss+xml" title="iaco" href="/rss.xml" />
		<link rel="preload" href="%sveltekit.assets%/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/source-serif-4-italic.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- the blog and the cms install as two separate apps, see hooks.server.js -->
		%app.install%
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
